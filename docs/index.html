<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar Contábil</title>
  <meta name="description" content="Notícias e projetos de lei para escritórios de contabilidade, filtrados por área.">
  <meta name="theme-color" content="#05070d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Radar Contábil">
  <script>
    /* Tema: futurista é o padrão; ?tema=classico (ou o botão ★) volta ao visual clássico */
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get("tema"); } catch (e) {}
      try { if (t) localStorage.setItem("radar.tema", t); else t = localStorage.getItem("radar.tema"); } catch (e) {}
      if (t !== "classico") document.documentElement.setAttribute("data-tema", "futurista");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilo.css?v=8">
  <link rel="stylesheet" href="futurista.css?v=8">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="marca">
        <img src="icones/icone.svg" alt="" width="32" height="32">
        <div>
          <h1>Radar Contábil</h1>
          <p id="atualizado" class="sutil">Carregando…</p>
        </div>
      </div>
      <div class="busca">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="busca" type="search" placeholder="Buscar (ex.: Simples, eSocial, ITCMD)" autocomplete="off" enterkeyhint="search" aria-label="Buscar">
      </div>
      <nav id="abas" class="abas" role="tablist" aria-label="Seções">
        <button class="aba" role="tab" data-tipo="noticia" aria-selected="true">Notícias <span class="qtd-novos" hidden></span></button>
        <button class="aba" role="tab" data-tipo="projeto" aria-selected="false">Leis e projetos <span class="qtd-novos" hidden></span></button>
      </nav>
      <div class="topo-acoes">
      <button id="btn-tema" class="btn-tema" title="Trocar o visual">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3l2.2 5.6L20 9l-4.5 3.8L17 19l-5-3.2L7 19l1.5-6.2L4 9l5.8-.4z" fill="currentColor"/></svg>
        <span>Visual futurista</span>
      </button>
      <button id="btn-filtros" class="btn-icone" aria-expanded="false" aria-controls="painel-filtros" title="Filtros">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <span id="contador-filtros" class="bolinha" hidden></span>
      </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="lateral">
      <section class="bloco">
        <h2 class="titulo-bloco">Áreas</h2>
        <nav id="areas" class="chips" aria-label="Áreas"></nav>
      </section>

      <section class="bloco">
        <h2 class="titulo-bloco">Setores</h2>
        <nav id="setores" class="chips chips-setores" aria-label="Setores"></nav>
      </section>

      <section id="painel-filtros" class="bloco filtros">
        <h2 class="titulo-bloco">Filtros</h2>
        <label>Estado
          <select id="f-uf"><option value="">Todos os estados</option></select>
        </label>
        <label>Município
          <select id="f-municipio"><option value="">Todos os municípios</option></select>
        </label>
        <label>Mostrar
          <select id="f-mostrar">
            <option value="todos">Todos</option>
            <option value="novos">Só novos</option>
            <option value="naolidos">Não lidos</option>
            <option value="favoritos">Favoritos</option>
          </select>
        </label>
        <label>Período
          <select id="f-periodo">
            <option value="hoje">Hoje</option>
            <option value="7">Últimos 7 dias</option>
            <option value="30" selected>Últimos 30 dias</option>
            <option value="tudo">Todo o histórico</option>
          </select>
        </label>
        <label id="rotulo-fonte">Fonte
          <select id="f-fonte"><option value="">Todas as fontes</option></select>
        </label>
        <label class="check"><input id="f-outros" type="checkbox" checked> Esconder "Outros"</label>
        <div class="filtros-acoes">
          <button id="btn-limpar" class="btn-texto">Limpar filtros</button>
          <button id="btn-ler-todos" class="btn-texto">Marcar visíveis como lidos</button>
        </div>
      </section>

      <details class="bloco fontes-status">
        <summary>Situação das fontes</summary>
        <ul id="fontes-status"></ul>
      </details>
    </aside>

    <main>
      <nav id="esferas" class="esferas" aria-label="Esfera"></nav>
      <p id="resumo-lista" class="resumo-lista"></p>
      <ol id="lista" class="lista"></ol>
      <button id="btn-mais" class="btn-mais" hidden>Mostrar mais</button>
      <p id="vazio" class="vazio" hidden>Nenhum item com esses filtros.</p>
      <p class="sutil nota">Favoritos e lidos ficam salvos só neste aparelho. Cada item leva ao site original.</p>
    </main>
  </div>

  <script src="app.js?v=8"></script>
</body>
</html>
